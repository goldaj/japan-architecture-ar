name: Live WebRTC foundation
on:
  push:
    branches: ["feat/live-**"]
  pull_request:
    branches: [develop]
permissions:
  contents: read
jobs:
  live-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm --prefix live run check
      - run: npm --prefix live test
